name: Auto Generate Changelog

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-changelog:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Generate CHANGELOG.md
      - name: Generate changelog
        run: |
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          TYPES=("feat:Features" "fix:Bug Fixes" "docs:Documentation" "chore:Chores" "refactor:Refactoring" "test:Tests" "style:Style" "perf:Performance")
          DATES=$(git log --date=short --pretty=format:"%ad" | sort -u -r)

          for DATE in $DATES; do
            echo "## $DATE" >> CHANGELOG.md

            for TYPE_PAIR in "${TYPES[@]}"; do
              TYPE=$(echo $TYPE_PAIR | cut -d: -f1)
              HEADING=$(echo $TYPE_PAIR | cut -d: -f2)

              COUNT=$(git log --since="$DATE 00:00" --until="$DATE 23:59" --grep="^$TYPE" --pretty=oneline | wc -l)
              if [ "$COUNT" -gt 0 ]; then
                echo "### $HEADING" >> CHANGELOG.md
                git log --since="$DATE 00:00" --until="$DATE 23:59" --grep="^$TYPE" \
                  --pretty=format:"- %an | %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
                  >> CHANGELOG.md
                echo "" >> CHANGELOG.md
              fi
            done
          done

      # 3️⃣ Configure Git
      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 4️⃣ Create or update the changelog branch safely
      - name: Create/update changelog branch
        run: |
          git fetch origin changelog-update || true

          if git show-ref --verify --quiet refs/remotes/origin/changelog-update; then
            git checkout -B changelog-update origin/changelog-update
          else
            git checkout -B changelog-update
          fi

          git add CHANGELOG.md

          # Commit only if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update CHANGELOG.md"
            git push origin changelog-update --set-upstream --force
          else
            echo "No changes to commit"
          fi

      # 5️⃣ Create a Pull Request automatically
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto update CHANGELOG.md"
          branch: changelog-update
          base: main
          title: "Auto-generated changelog update"
          body: "This PR contains the latest automatically generated changelog."
          draft: false
